<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="dark">
<style>
html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:transparent!important;
}
body{position:relative}
model-viewer{
    position:absolute;
    inset:-10%;
    width:120%;
    height:120%;
    background:transparent!important;
    --poster-color:transparent;
    --progress-bar-color:#f15a29;
    --progress-bar-height:2px;
    pointer-events:none;
}
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
<model-viewer
    id="weapon"
    src="./ak47_rust.glb"
    alt="AK47 Rust"
    loading="eager"
    reveal="auto"
    environment-image="neutral"
    shadow-intensity=".78"
    shadow-softness=".9"
    exposure="1.08"
    camera-orbit="70deg 76deg 67%"
    field-of-view="20deg"
    orientation="0deg 0deg -4deg"
    interaction-prompt="none">
</model-viewer>
<script>
(() => {
    const viewer = document.getElementById('weapon');

    window.addEventListener('message', (event) => {
        if (event.source !== window.parent)
            return;

        const data = event.data;
        if (!data || data.type !== 'zr-weapon-orbit')
            return;

        const yaw = Number(data.yaw);
        const pitch = Number(data.pitch);
        const distance = Number(data.distance);

        if (![yaw, pitch, distance].every(Number.isFinite))
            return;

        viewer.setAttribute(
            'camera-orbit',
            `${yaw.toFixed(2)}deg ${pitch.toFixed(2)}deg ${distance.toFixed(2)}%`
        );
    });
})();
</script>
</body>
</html>
